# Настройки воркера ИИ-помощника для Cloudflare (см. README, раздел «ИИ-помощник»).
name = "math-tutor"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# Адрес вашего сайта (откуда разрешены запросы). Через запятую можно указать несколько.
ALLOWED_ORIGIN = "https://mrsolo743-dot.github.io"
# Бесплатная модель Gemini
GEMINI_MODEL = "gemini-2.5-flash"

# Ключ НЕ пишите сюда. Задайте его секретом:
#   npx wrangler secret put GEMINI_API_KEY

# Вариант без ключа Google: бесплатные модели Cloudflare Workers AI.
# Работает, если ключ GEMINI_API_KEY не задан.
[ai]
binding = "AI"

# [vars] CF_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"  — можно сменить модель
